<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Akun - Griya Sprei</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/register.css">
</head>
<body class="page-register">

  <main class="card">
    <h1 class="card__title">Daftar Akun Baru</h1>
    <p class="card__subtitle">Buat akun pelanggan untuk memesan sprei dan memantau status pesanan.</p>

    <form id="registerForm" novalidate>

      <!-- Nama -->
      <div class="field">
        <label class="field__label" for="name">Nama Lengkap <span class="required">*</span></label>
        <div class="input">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>
          <input type="text" id="name" placeholder="Ibu Siti Rahmawati" autocomplete="name">
        </div>
        <p class="field__error" hidden></p>
      </div>

      <!-- Email -->
      <div class="field">
        <label class="field__label" for="email">Email<span class="required">*</span></label>
        <div class="input">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input type="email" id="email" placeholder="nama@email.com" autocomplete="email">
        </div>
        <p class="field__error" hidden></p>
      </div>

      <!-- WhatsApp -->
      <div class="field">
        <label class="field__label" for="phone">Nomor WhatsApp (No HP) <span class="required">*</span></label>
        <div class="input">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v12H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>
          <span class="input__prefix">+62</span>
          <input type="tel" id="phone" placeholder="812-3456-7890" autocomplete="tel-national">
        </div>
        <p class="field__error" hidden></p>
      </div>

      <!-- Kata sandi -->
      <div class="field">
        <label class="field__label" for="password">Buat Kata Sandi <span class="required">*</span></label>
        <div class="input">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="password" placeholder="Minimal 8 karakter" autocomplete="new-password">
          <button type="button" class="input__toggle" data-target="password" aria-label="Tampilkan kata sandi">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="field__error" hidden></p>
      </div>

      <!-- Konfirmasi -->
      <div class="field">
        <label class="field__label" for="confirm">Konfirmasi Kata Sandi <span class="required">*</span></label>
        <div class="input">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/><rect x="9" y="11" width="6" height="5" rx="1"/></svg>
          <input type="password" id="confirm" placeholder="Ulangi kata sandi Anda" autocomplete="new-password">
          <button type="button" class="input__toggle" data-target="confirm" aria-label="Tampilkan kata sandi">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="field__error" hidden></p>
      </div>

      <!-- Persetujuan -->
      <div class="field">
        <label class="terms">
          <input type="checkbox" id="terms">
          <span class="terms__box"></span>
          <span>Saya menyetujui <a href="#">ketentuan pemesanan sprei</a> &amp; perlindungan data privasi Griya Sprei Malang.</span>
        </label>
        <p class="field__error" hidden></p>
      </div>

      <button type="submit" class="btn-submit">
        Daftar Akun Sekarang
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6M14 17l2.5 2.5L21 14"/></svg>
      </button>
    </form>

    <p class="login-link">Sudah memiliki akun? <a href="login.html">Masuk di sini</a></p>
  </main>

  <script src="../assets/js/register.js"></script>
</body>
</html>
